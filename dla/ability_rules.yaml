  viscous_goo_grenade:                  # Viscous: Splatter
    note: "bounces: the second and third hits deal 50% / 38%"
    terms: [{key: Damage, mult: 1.4, aoe: true}]
  ability_viper_debuffdagger:           # Vyper: Screwjab Dagger
    note: "each further dagger on the same target adds DamagePerStack (~1 stack on average)"
    terms:
      - {key: Damage, aoe: false}
      - {key: DamagePerStack, aoe: false}
