<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deadlock Meta Lab</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --pos: #2a78d6; --neg: #e34948; --mid: #f0efec; --accent: #2a78d6;
  --good: #006300; --flag: #eda100; --chip: #eef3fb;
  /* tier scale: diverging blue <- gray -> red, 3 validated steps per arm (S..F) */
  --t6: #e2c522; --t6-ink: #0b0b0b;  --t5: #2a78d6; --t5-ink: #fff;  --t4: #86b6ef; --t4-ink: #0b0b0b;
  --t3: #dcdbd4; --t3-ink: #0b0b0b; --t3-dot: #a8a79f;
  --t2: #ee9796; --t2-ink: #0b0b0b; --t1: #e34948; --t1-ink: #fff;  --t0: #a8302f; --t0-ink: #fff;
  /* categorical (validated, fixed order): value-breakdown groups, impact categories */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --pos: #3987e5; --neg: #e66767; --mid: #383835; --accent: #3987e5;
    --good: #0ca30c; --flag: #c98500; --chip: #1d2733;
    --t6: #e2c522; --t6-ink: #0b0b0b; --t5: #1c5cab; --t5-ink: #0b0b0b; --t4: #3987e5; --t4-ink: #fff;
    --t3: #383835; --t3-ink: #f0efec; --t3-dot: #6b6a64;
    --t2: #f2a8a7; --t2-ink: #0b0b0b;    --t1: #e66767; --t1-ink: #0b0b0b; --t0: #9b3332; --t0-ink: #fff;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --pos: #3987e5; --neg: #e66767; --mid: #383835; --accent: #3987e5;
  --good: #0ca30c; --flag: #c98500; --chip: #1d2733;
  --t6: #e2c522; --t6-ink: #0b0b0b; --t5: #1c5cab; --t5-ink: #0b0b0b; --t4: #3987e5; --t4-ink: #fff;
  --t3: #383835; --t3-ink: #f0efec; --t3-dot: #6b6a64;
  --t2: #f2a8a7; --t2-ink: #0b0b0b;    --t1: #e66767; --t1-ink: #0b0b0b; --t0: #9b3332; --t0-ink: #fff;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
       font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 60px; }
header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 13px; }
.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page);
            display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 0; margin-top: 10px;
            border-bottom: 1px solid var(--border); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink-2); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); cursor: pointer; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 14px 0 16px; }
nav.tabs button { border: 0; background: none; color: var(--ink-2); padding: 7px 12px; border-radius: 8px; font: inherit;
                  cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--chip); color: var(--ink); font-weight: 600; }
section[hidden] { display: none !important; }
section > .card + .card, section > .card + .grid2, section > .toolbar + .card { margin-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.card h2 { font-size: 15px; margin: 0 0 2px; }
.card .why { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
.toolbar .grow { flex: 1; }
.lbl { color: var(--ink-2); }
select, input[type="search"], .combo input { font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }

/* scrollable tables with a sticky header row */
.tbl { overflow: auto; max-height: var(--tbl-h, min(70vh, 640px)); border-radius: 8px; overscroll-behavior: contain; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { color: var(--muted); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none;
     position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--axis); }
th.sorted { color: var(--ink); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tbody tr:hover td { background: var(--chip); }
td.dim { color: var(--muted); }
.compact th, .compact td { padding-inline: 5px; }
.compact .flag { margin-left: 0; }
.rowcount { color: var(--muted); font-size: 12px; margin-top: 6px; }

.tier { display: inline-block; min-width: 22px; text-align: center; font-weight: 700; font-size: 11.5px; line-height: 18px;
        border-radius: 5px; padding: 0 5px; }
.tier.t6 { background: var(--t6); color: var(--t6-ink); } .tier.t5 { background: var(--t5); color: var(--t5-ink); }
.tier.t4 { background: var(--t4); color: var(--t4-ink); } .tier.t3 { background: var(--t3); color: var(--t3-ink); }
.tier.t2 { background: var(--t2); color: var(--t2-ink); } .tier.t1 { background: var(--t1); color: var(--t1-ink); }
.tier.t0 { background: var(--t0); color: var(--t0-ink); }
.tier.core { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); letter-spacing: .02em; }
.legend { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.legend .tier { min-width: 20px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin: 0 3px 0 8px; vertical-align: -1px; }
.ring { display: inline-block; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink); vertical-align: -1px; margin: 0 3px 0 8px; }
.stack { display: inline-flex; gap: 2px; width: 130px; height: 10px; vertical-align: middle; margin-right: 6px; }
.stack span { height: 10px; border-radius: 2px; }
.stack span:first-child { border-radius: 4px 2px 2px 4px; } .stack span:last-child { border-radius: 2px 4px 4px 2px; }
.pos { color: var(--good); } .negv { color: var(--neg); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); }
.kv b { color: var(--ink); font-weight: 600; }
/* item value: editable model assumptions */
details.model summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; list-style: none; }
details.model summary::-webkit-details-marker { display: none; }
details.model summary h2::before { content: "▸ "; color: var(--muted); }
details.model[open] summary h2::before { content: "▾ "; }
.params { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 4px 24px; }
.params h3 { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); font-weight: 600; margin: 10px 0 0;
             text-transform: uppercase; letter-spacing: .05em; }
.pf { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.pf input { width: 78px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
            border-radius: 6px; padding: 3px 6px; text-align: right; }
.pf.chg span { color: var(--ink); font-weight: 600; }
.pf.chg input { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pf.kit { gap: 8px; }
.btn { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
       padding: 5px 10px; cursor: pointer; }
.btn:hover { background: var(--chip); }
.seg button:disabled { opacity: .45; cursor: default; }
.grp { display: inline-flex; gap: 8px; align-items: center; }
.enemies { display: flex; flex-wrap: wrap; gap: 8px; }
.recs { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 8px; }
.subh { font-size: 13px; margin: 16px 0 8px; }
.metagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.metacard { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
.metacard ol { margin: 4px 0 0; padding-left: 18px; }
.chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--chip); color: var(--ink-2);
        border: 1px solid var(--border); margin-left: 6px; }

.bar { display: inline-grid; grid-template-columns: 40px 40px; align-items: center; vertical-align: middle; margin-right: 6px;
       position: relative; }
.bar span { height: 8px; }
.bar .n { justify-self: end; border-radius: 4px 0 0 4px; background: var(--neg); }
.bar .p { justify-self: start; border-radius: 0 4px 4px 0; background: var(--pos); }
.bar::after { content: ""; position: absolute; left: 40px; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.flag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--flag);
        color: var(--ink); margin-left: 4px; }
.flag::before { content: "▲ "; color: var(--flag); }
.note { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.empty { color: var(--muted); padding: 20px 0; }

/* searchable dropdown */
.combo { position: relative; display: inline-block; }
.combo input { width: 220px; padding-right: 26px; cursor: pointer; }
.combo input:focus { cursor: text; outline: 2px solid var(--accent); outline-offset: -1px; }
.combo::after { content: "▾"; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--muted);
                pointer-events: none; font-size: 12px; }
.combo ul { position: absolute; z-index: 30; top: 100%; left: 0; min-width: 100%; max-height: 300px; overflow: auto;
            margin: 4px 0 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.combo li { padding: 5px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; color: var(--ink); }
.combo li[aria-selected="true"] { background: var(--chip); }
.combo li.sep { border-bottom: 1px solid var(--grid); border-radius: 6px 6px 0 0; margin-bottom: 3px; }
.combo li.none { color: var(--muted); cursor: default; }
.combo li b { color: var(--accent); font-weight: 700; }

svg text { fill: var(--ink-2); font: 11px system-ui, sans-serif; }
svg text.pl { fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
svg text.axt { fill: var(--muted); }
.chart { position: relative; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
       border-radius: 8px; padding: 6px 9px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 40;
       max-width: 320px; }
.method p { max-width: 80ch; color: var(--ink-2); }
.method b { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Deadlock Meta Lab</h1>
  <div class="sub" id="metaLine"></div>
</header>

<div class="controls">
  <div class="seg" id="bracketSeg" role="group" aria-label="Rank bracket"></div>
  <label class="chk"><input type="checkbox" id="rankedOnly"> Ranked only</label>
  <label class="chk"><input type="checkbox" id="hideLow" checked> Hide low-sample rows</label>
  <span class="sub" id="scopeCount"></span>
</div>

<nav class="tabs" role="tablist" id="tabs"></nav>

<section id="tab-overview"></section>
<section id="tab-heroes" hidden></section>
<section id="tab-items" hidden></section>
<section id="tab-counters" hidden></section>
<section id="tab-counterbuy" hidden></section>
<section id="tab-impact" hidden></section>
<section id="tab-value" hidden></section>
<section id="tab-fits" hidden></section>
<section id="tab-matchups" hidden></section>
<section id="tab-profiles" hidden></section>
<section id="tab-method" hidden></section>
</div>
<div id="tip" hidden></div>

<script>/*__ITEMVALUE_JS__*/</script>
<script>
const PAYLOAD = /*__DATA__*/null;
const META = PAYLOAD.meta, RAW = PAYLOAD.data;
const cache = {};
function rows(name) {
  if (cache[name]) return cache[name];
  const c = RAW[name]; if (!c) return (cache[name] = []);
  // dictionary-encoded string columns: {d: [values], i: [indices]}
  for (const k of Object.keys(c)) if (c[k] && c[k].d) { const d = c[k].d; c[k] = c[k].i.map(j => j < 0 ? null : d[j]); }
  const keys = Object.keys(c), n = c[keys[0]].length, out = new Array(n);
  for (let i = 0; i < n; i++) { const o = {}; for (const k of keys) o[k] = c[k][i]; out[i] = o; }
  return (cache[name] = out);
}
const state = { bracket: META.focus_bracket || "All", ranked: false, hideLow: true, tab: "overview",
                itemHero: "general", ctMode: "hero", labelAll: {} };
// deep link: #tab or #tab/bracket (e.g. #counters/Emissary-Phantom)
{ const [t, b] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (t) state.tab = t; if (b && (b === "All" || META.brackets.includes(b))) state.bracket = b; }
const scopeName = () => (state.bracket === "All" ? "All" : state.bracket) + (state.ranked ? " | Ranked" : "");
const inScope = name => rows(name).filter(r => r.scope === scopeName() && !(state.hideLow && r.low_sample));

// ---------- formatting
const pct = v => v == null ? "–" : (v * 100).toFixed(1) + "%";
const pp = v => v == null ? "–" : (v > 0 ? "+" : "") + (v * 100).toFixed(1) + " pp";
const num = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
const ratio = v => v == null ? "–" : "×" + Number(v).toFixed(2);
const qfmt = v => v == null ? "–" : v < 0.001 ? "<.001" : v.toFixed(3);
const shop = v => v == null ? "–" : "T" + v;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function divBar(v, maxAbs, label) {
  const w = maxAbs > 0 ? Math.min(40, Math.abs(v ?? 0) / maxAbs * 40) : 0;
  return `<span class="bar"><span class="n" style="width:${v < 0 ? w : 0}px"></span><span class="p" style="width:${v > 0 ? w : 0}px"></span></span>${label}`;
}

// ---------- tiers: S..F from a value's distance to the median of its population, in SDs
const TIER_LETTERS = ["F", "E", "D", "C", "B", "A", "S"];
const TIER_CUTS = [1.5, 0.9, 0.3, -0.3, -0.9, -1.5];       // z >= cut -> S, A, B, C(>-0.3), D, E, else F
function tierer(pop, get) {
  const v = pop.map(get).filter(x => x != null && isFinite(x)).sort((a, b) => a - b);
  if (v.length < 3) return () => null;
  const med = v[Math.floor(v.length / 2)], mean = v.reduce((a, b) => a + b, 0) / v.length;
  const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / (v.length - 1)) || 1e-9;
  return x => {
    if (x == null || !isFinite(x)) return null;
    const z = (x - med) / sd;
    if (z >= TIER_CUTS[0]) return 6; if (z >= TIER_CUTS[1]) return 5; if (z >= TIER_CUTS[2]) return 4;
    if (z > TIER_CUTS[3]) return 3; if (z > TIER_CUTS[4]) return 2; if (z > TIER_CUTS[5]) return 1; return 0;
  };
}
// annotate rows with _t (6 = S ... 0 = F), tiered against `pop` (defaults to the rows themselves)
const withTiers = (data, get, pop = data) => { const t = tierer(pop, get); return data.map(r => ({ ...r, _t: t(get(r)) })); };
// _t = 7 marks a core item (bought by most of a hero's players): own badge, outside the S..F ranking
const CORE_T = 7;
const badge = t => t == null ? "–" : t === CORE_T
  ? `<span class="tier core" title="Core: bought by ≥${Math.round((META.core_buy_rate ?? 0.5) * 100)}% of this hero's players. Not ranked against situational items; see the on-time effect">CORE</span>`
  : `<span class="tier t${t}" title="Tier ${TIER_LETTERS[t]}">${TIER_LETTERS[t]}</span>`;
// tiers among situational items only; core rows get CORE_T
const withCoreTiers = (data, get) => { const t = tierer(data.filter(r => !r.core), get);
  return data.map(r => ({ ...r, _t: r.core ? CORE_T : t(get(r)) })); };
const sgn = (v, d = 1) => v == null || !isFinite(v) ? "–" : (v > 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const sgnc = (v, d = 1, good = 1) => v == null || !isFinite(v) ? "–" : `<span class="${v * good > 0 ? "pos" : v * good < 0 ? "negv" : ""}">${sgn(v, d)}</span>`;
const TIER_COL = (what) => ({ key: "_t", label: "Tier", l: 1, fmt: badge,
  tip: `Relative tier by ${what} within this list: S ≥ +1.5 SD from the median, A ≥ +0.9, B ≥ +0.3, C within ±0.3, D, E, F mirror below` });
const tierLegend = () => `<span class="legend" title="Relative tiers: distance from the median of this view, in standard deviations">Tier ${
  [6, 5, 4, 3, 2, 1, 0].map(badge).join("")}</span>`;

// ---------- generic sortable table (scrolls inside its card; header row stays visible)
function table(el, data, cols, opts = {}) {
  const st = el._sort || { key: opts.sort, desc: opts.desc !== false };
  el._sort = st;
  const maxAbs = {};
  for (const c of cols) if (c.bar) maxAbs[c.key] = Math.max(1e-9, ...data.map(r => Math.abs(r[c.key] ?? 0)));
  const sorted = [...data].sort((a, b) => {
    const x = a[st.key], y = b[st.key];
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * (st.desc ? -1 : 1);
  });
  const shown = sorted.slice(0, opts.limit || 1000);
  if (!shown.length) { el.innerHTML = `<div class="empty">No rows in this scope${state.hideLow ? " (try showing low-sample rows)" : ""}.</div>`; return; }
  const th = cols.map(c => `<th class="${c.l ? "l" : ""} ${st.key === c.key ? "sorted" : ""}" data-k="${c.key}" title="${esc(c.tip || "")}">${esc(c.label)}${st.key === c.key ? (st.desc ? " ↓" : " ↑") : ""}</th>`).join("");
  const tr = shown.map(r => "<tr>" + cols.map(c => {
    const v = r[c.key]; let html = c.fmt ? c.fmt(v, r) : esc(v);
    if (c.bar) html = divBar(v, maxAbs[c.key], html);
    return `<td class="${c.l ? "l" : ""} ${c.dim && c.dim(r) ? "dim" : ""}">${html}</td>`;
  }).join("") + "</tr>").join("");
  const h = opts.height ? ` style="--tbl-h:${opts.height}"` : "";
  el.innerHTML = `<div class="tbl"${h}><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>` +
    `<div class="rowcount">${num(shown.length)} row${shown.length === 1 ? "" : "s"}${sorted.length > shown.length ? ` of ${num(sorted.length)}` : ""}</div>`;
  el.querySelectorAll("th").forEach(h => h.onclick = () => {
    const k = h.dataset.k; if (st.key === k) st.desc = !st.desc; else { st.key = k; st.desc = true; }
    table(el, data, cols, opts);
  });
}

// ---------- searchable dropdown. options: [{v, label, sep?}]. Matches the start of any word of the
// label ("mi" -> Mina, Mirage; "dan" -> Deadman Danny); several words must each match.
const words = s => String(s).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
function combo(host, options, value, onChange, { width, label } = {}) {
  host.innerHTML = `<div class="combo"><input type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
    autocomplete="off" spellcheck="false" aria-label="${esc(label || "Search")}" ${width ? `style="width:${width}"` : ""}><ul role="listbox" hidden></ul></div>`;
  const inp = host.querySelector("input"), ul = host.querySelector("ul");
  const cur = () => options.find(o => String(o.v) === String(value));
  let shown = [], hi = 0;
  const match = (o, qs) => { if (!qs.length) return true; const w = words(o.label); return qs.every(t => w.some(x => x.startsWith(t))); };
  const mark = (lab, qs) => { let s = esc(lab); for (const t of qs) s = s.replace(new RegExp(`(^|[^a-z0-9])(${t})`, "ig"), "$1<b>$2</b>"); return s; };
  const update = () => { ul.querySelectorAll("li[data-i]").forEach(li => li.setAttribute("aria-selected", +li.dataset.i === hi));
    ul.querySelector(`li[data-i="${hi}"]`)?.scrollIntoView({ block: "nearest" }); };
  const draw = q => {
    const qs = words(q); shown = options.filter(o => match(o, qs));
    hi = qs.length ? 0 : Math.max(0, shown.findIndex(o => String(o.v) === String(value)));
    ul.innerHTML = shown.length ? shown.map((o, i) => `<li role="option" data-i="${i}" class="${o.sep && !qs.length ? "sep" : ""}">${mark(o.label, qs)}</li>`).join("")
                                : `<li class="none">No match</li>`;
    ul.hidden = false; inp.setAttribute("aria-expanded", "true"); update();
  };
  const close = () => { ul.hidden = true; inp.setAttribute("aria-expanded", "false"); inp.value = cur()?.label ?? ""; };
  const pick = i => { const o = shown[i]; if (!o) return; value = o.v; close(); inp.blur(); onChange(o.v); };
  inp.value = cur()?.label ?? "";
  inp.onfocus = () => { inp.select(); draw(""); };
  inp.oninput = () => draw(inp.value);
  inp.onblur = close;
  inp.onkeydown = e => {
    if (e.key === "ArrowDown") { hi = Math.min(shown.length - 1, hi + 1); update(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { hi = Math.max(0, hi - 1); update(); e.preventDefault(); }
    else if (e.key === "Enter") { pick(hi); e.preventDefault(); }
    else if (e.key === "Escape") { inp.blur(); }
  };
  ul.onmousedown = e => { e.preventDefault(); const li = e.target.closest("li[data-i]"); if (li) pick(+li.dataset.i); };
}

}

// ---------- scatter with tier-colored points, collision-avoiding labels and hover tooltips
function niceTicks(a, b, n) {
  const span = b - a || 1, raw = span / n, p = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
  const out = []; for (let v = Math.ceil(a / step) * step; v <= b + 1e-12; v += step) out.push(+v.toFixed(10));
  return out;
}
function scatterPlot(el, data, o) {
  if (!data.length) { el.innerHTML = '<div class="empty">No data in this view.</div>'; return; }
  const W = Math.max(320, el.clientWidth || 900), H = o.height || 400, m = { l: 56, r: 20, t: 18, b: 40 };
  const xs = data.map(o.x), ys = data.map(o.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); const xp = (x1 - x0) * 0.05 || 1; x0 = o.xZero ? 0 : x0 - xp; x1 += xp;
  let y0 = Math.min(...ys, o.ref ?? Infinity), y1 = Math.max(...ys, o.ref ?? -Infinity); const yp = (y1 - y0) * 0.08 || 0.01; y0 -= yp; y1 += yp;
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  let s = `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.yTitle)} against ${esc(o.xTitle)}">`;
  for (const t of niceTicks(y0, y1, 6)) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${o.yTick(t)}</text>`;
  for (const t of niceTicks(x0, x1, Math.max(4, Math.round(W / 110)))) s += `<line x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grid)" stroke-dasharray="2 4"/><text x="${X(t)}" y="${H - m.b + 16}" text-anchor="middle">${o.xTick(t)}</text>`;
  if (o.ref != null) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke="var(--axis)" stroke-width="1.5"/>`;
  if (o.xRef != null && o.xRef > x0 && o.xRef < x1) s += `<line x1="${X(o.xRef)}" x2="${X(o.xRef)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)" stroke-width="1.5"/>`;
  if (o.diag) { const a = Math.max(x0, y0), b = Math.min(x1, y1);   // y = x
    if (b > a) s += `<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" stroke="var(--axis)" stroke-dasharray="5 4" stroke-width="1.5"/>`; }
  s += `<text class="axt" x="${W - m.r}" y="${H - 6}" text-anchor="end">${esc(o.xTitle)} →</text><text class="axt" x="${m.l}" y="${m.t - 6}">↑ ${esc(o.yTitle)}</text>`;
  const pts = data.map((d, i) => ({ d, i, px: X(o.x(d)), py: Y(o.y(d)), r: o.r ? o.r(d) : 5, t: o.tier(d) }));
  // big points first so small ones stay visible on top
  for (const p of [...pts].sort((a, b) => b.r - a.r)) {
    if (p.t === CORE_T) {   // core item: hollow ring, outside the tier colors
      s += `<circle cx="${p.px}" cy="${p.py}" r="${p.r + 1}" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>`;
      continue;
    }
    const fill = o.fill ? o.fill(p.d) : p.t == null || p.t === 3 ? "var(--t3-dot)" : `var(--t${p.t})`;
    s += `<circle cx="${p.px}" cy="${p.py}" r="${p.r}" fill="${fill}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  // labels: notable first (by distance from the middle), greedy placement around each point
  const labelAll = !!o.labelAll, boxes = [];
  const ov = (a, b) => a.x1 > b.x0 && a.x0 < b.x1 && a.y1 > b.y0 && a.y0 < b.y1;
  const obst = pts.map(p => ({ x0: p.px - p.r, x1: p.px + p.r, y0: p.py - p.r, y1: p.py + p.r, i: p.i }));
  const mid = (Math.min(...ys) + Math.max(...ys)) / 2;
  const cand = pts.filter(p => labelAll || o.notable(p.d))
    .sort((a, b) => (o.notable(b.d) - o.notable(a.d)) || Math.abs(o.y(b.d) - mid) - Math.abs(o.y(a.d) - mid));
  // candidate spots in rings around the point; outer rings get a leader line
  const rings = labelAll ? [0, 14, 28, 44] : [0, 14];
  let leaders = "", texts = "";
  for (const p of cand) {
    const txt = String(o.label(p.d)), w = txt.length * 6.1 + 2;
    let best = null, bestScore = Infinity;
    for (const [k, e] of rings.entries()) {
      const r = p.r + e;
      const opts = [[r + 4, 4, "start"], [-(r + 4), 4, "end"], [0, -(r + 5), "middle"], [0, r + 13, "middle"],
                    [r + 2, -(r + 2), "start"], [r + 2, r + 11, "start"], [-(r + 2), -(r + 2), "end"], [-(r + 2), r + 11, "end"]];
      for (const [dx, dy, a] of opts) {
        const x = p.px + dx, y = p.py + dy, bx0 = a === "start" ? x : a === "end" ? x - w : x - w / 2;
        const b = { x0: bx0, x1: bx0 + w, y0: y - 9, y1: y + 3 };
        if (b.x0 < m.l - 4 || b.x1 > W - 2 || b.y0 < m.t - 2 || b.y1 > H - m.b + 2) continue;
        const score = boxes.filter(q => ov(q, b)).length * 3 + obst.filter(q => q.i !== p.i && ov(q, b)).length + k * 0.5;
        if (score < bestScore) { bestScore = score; best = { x, y, a, b, k }; }
      }
      if (bestScore < 1) break;          // free spot found in this ring
    }
    if (!best || (!labelAll && bestScore >= 3)) continue;
    boxes.push(best.b);
    if (best.k > 0) {                    // leader from the point's edge to the label box's nearest corner
      const lx = Math.min(Math.max(p.px, best.b.x0), best.b.x1), ly = Math.min(Math.max(p.py, best.b.y0), best.b.y1);
      const dd = Math.hypot(lx - p.px, ly - p.py) || 1;
      leaders += `<line x1="${p.px + (lx - p.px) / dd * p.r}" y1="${p.py + (ly - p.py) / dd * p.r}" x2="${lx}" y2="${ly}" stroke="var(--axis)" stroke-width="1"/>`;
    }
    texts += `<text class="pl" x="${best.x}" y="${best.y}" text-anchor="${best.a}">${esc(txt)}</text>`;
  }
  s += leaders + texts;
  for (const p of pts) s += `<circle cx="${p.px}" cy="${p.py}" r="${Math.max(10, p.r + 4)}" fill="transparent" data-i="${p.i}"/>`;
  el.innerHTML = `<div class="chart">${s}</svg></div>`;
  const tip = document.getElementById("tip");
  el.querySelectorAll("circle[data-i]").forEach(c => {
    c.onmousemove = e => { const d = data[c.dataset.i]; tip.hidden = false; tip.innerHTML = o.tip(d);
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = (e.clientX + 14 + tw > innerWidth ? e.clientX - tw - 12 : e.clientX + 14) + "px";
      tip.style.top = (e.clientY + 14 + th > innerHeight ? e.clientY - th - 12 : e.clientY + 14) + "px"; };
    c.onmouseleave = () => tip.hidden = true;
  });
}
const labelToggle = (key, what) =>

function bindLabelToggle(el, key, redraw) {

  cb.onchange = () => { state.labelAll[key] = cb.checked; redraw(); };
}
const ppTick = t => (t > 0 ? "+" : "") + Number((t * 100).toFixed(2));
const minTick = t => Number(t.toFixed(1)) + "m";
const pctTick = t => Number((t * 100).toFixed(1)) + "%";
const sizeBy = (data, get) => { const mx = Math.max(1, ...data.map(get)); return d => 3 + 6 * Math.sqrt((get(d) || 0) / mx); };
// notable = the n highest and k lowest by y
function notableSet(data, gy, n = 7, k = 4) {
  const srt = [...data].sort((a, b) => gy(b) - gy(a));
  return new Set([...srt.slice(0, n), ...srt.slice(-k)]);
}

  const f = filterState(tab);

// ---------- counterbuy planner: the best counter items for your hero against a specific enemy comp
const CB = META.counterbuy || {};
const CB_W = [["delta", "Extra win effect when the hero is an enemy"], ["kill_odds", "Kill odds against the hero"],
  ["protection", "Protection from the hero"], ["enemy_dmg", "Hero's damage drops after the purchase"],
  ["enemy_heal", "Hero's healing drops after the purchase"], ["dmg_taken", "Your damage taken from the hero drops"]];
const CB_P = [["threat_per_sd", "Extra weight per SD an enemy counters your hero", 0.1],
  ["damage_mix_weight", "Damage-type match of bullet / spirit defense items", 0.1],
  ["timing_tau_min", "Minutes late before a counter loses half its value", 1],
  ["negative_factor", "Share of an item's penalty vs an enemy that counts", 0.1],
  ["fit_weight", "Weight of the item's own effect on your hero", 0.25],
  ["soul_vs_slot", "Value per slot (0) ↔ per soul (1)", 0.1]];
const CB_LS = "dla.counterbuy.v1";
const cbDef = k => k.startsWith("w.") ? (CB.weights || {})[k.slice(2)] ?? 0 : CB[k] ?? 0;
const cbPar = k => state.cbP[k] ?? cbDef(k);
function cbSave() { try { localStorage.setItem(CB_LS, JSON.stringify({ me: state.cbMe, enemies: state.cbEnemies, p: state.cbP, slots: state.cbSlots })); } catch { /* storage unavailable */ } }
const ppc = (v, d = 1) => v == null || !isFinite(v) ? "–" : `<span class="${v > 0 ? "pos" : v < 0 ? "negv" : ""}">${v > 0 ? "+" : ""}${(v * 100).toFixed(d)}</span>`;
// counter strength of each item against each enemy hero, in pp of win effect (memoised per scope + weights)
let cbMemo = { key: null };
function cbPairs() {
  const W = Object.fromEntries(CB_W.map(([k]) => [k, cbPar("w." + k)]));
  const key = scopeName() + state.hideLow + JSON.stringify(W);
  if (cbMemo.key === key) return cbMemo;
  const rows = inScope("item_counters");
  const neg = v => v == null || !isFinite(v) ? null : -v;
  const get = { delta: r => r.delta_shrunk, kill_odds: r => r.off_lor, protection: r => neg(r.def_lor),
    enemy_dmg: r => neg(r.e_dmg_pct), enemy_heal: r => neg(r.e_heal_pct), dmg_taken: r => neg(r.taken_delta_pct) };
  const sd = {};          // spread of each signal over all item x hero pairs (not centred: 0 stays "no effect")
  for (const k in get) {
    const v = rows.map(get[k]).filter(x => x != null && isFinite(x));
    sd[k] = Math.sqrt(v.reduce((a, x) => a + x * x, 0) / Math.max(1, v.length)) || 1;
  }
  const pairs = new Map();
  for (const r of rows) {
    let z = 0; const parts = {};
    for (const k in get) {
      const v = get[k](r); if (v == null || !isFinite(v) || !W[k]) continue;
      const p = W[k] * v / sd[k]; parts[k] = p * sd.delta; z += p;
    }
    pairs.set(r.item_id + "|" + r.enemy_hero, { c: z * sd.delta, parts, n: r.n });
  }
  const pos = [...pairs.values()].map(p => p.c).filter(c => c > 0).sort((a, b) => a - b);
  const strong = pos[Math.floor(pos.length * 0.9)] || sd.delta;     // a "strong" counter (90th percentile)
  return (cbMemo = { key, pairs, unit: sd.delta, strong });
}
// how much each enemy counters `me` (win-effect points; negative = bad for you) and the weight that gives it
function cbThreats(me, enemies) {
  const hc = inScope("hero_counters");
  const sdM = Math.sqrt(hc.reduce((a, r) => a + (r.effect_shrunk || 0) ** 2, 0) / Math.max(1, hc.length)) || 1;
  const mine = new Map(hc.filter(r => String(r.hero_a) === String(me)).map(r => [r.hero_b, r.effect_shrunk]));
  return enemies.map(e => { const m = me != null ? mine.get(Number(e)) : null;
    const threat = m != null ? Math.max(0, -m / sdM) : 0;
    return { e: Number(e), matchup: m ?? null, threat, w: 1 + cbPar("threat_per_sd") * threat }; });
}
// each hero's power spike: the match length where its win rate is highest relative to other heroes
const CB_BUCKETS = [["wr_<25m", 20], ["wr_25-35m", 30], ["wr_35-45m", 40], ["wr_45m+", 50]];
function cbSpikes() {
  const hs = inScope("hero_stats"), avg = {};
  for (const [k] of CB_BUCKETS) { const v = hs.map(r => r[k]).filter(x => x != null); avg[k] = v.reduce((a, x) => a + x, 0) / Math.max(1, v.length); }
  return new Map(hs.map(r => {
    const rel = CB_BUCKETS.map(([k, m]) => [r[k] != null ? r[k] - avg[k] : null, m]).filter(([v]) => v != null);
    if (!rel.length) return [r.hero_id, 32];
    const lo = Math.min(...rel.map(([v]) => v));
    const ws = rel.map(([v, m]) => [v - lo + 1e-4, m]), sw = ws.reduce((a, [w]) => a + w, 0);
    return [r.hero_id, ws.reduce((a, [w, m]) => a + w * m, 0) / sw];
  }));
}
// share of an enemy comp's damage that is spirit (ability) damage, weighted like the enemies, vs an average hero
function cbMix(ew) {
  const prof = new Map(rows("hero_profiles").map(r => [r.hero_id, r.ability_damage_share]));
  const all = [...prof.values()].filter(x => x != null), avg = all.reduce((a, x) => a + x, 0) / Math.max(1, all.length);
  let s = 0, sw = 0; for (const { e, w } of ew) { const v = prof.get(e); if (v != null) { s += w * v; sw += w; } }
  return { comp: sw ? s / sw : avg, avg };
}
// score items against weighted enemies; need = remaining need per enemy (for the greedy set)
function cbScore(items, ew, fitOf, need) {
  const { pairs, unit } = cbPairs(), neg = cbPar("negative_factor"), fw = cbPar("fit_weight"), a = cbPar("soul_vs_slot");
  const spikes = cbSpikes(), tau = Math.max(0.1, cbPar("timing_tau_min")), mw = cbPar("damage_mix_weight");
  const mix = cbMix(ew), def = CB.defense || {};
  const mixMult = id => { const d = def[String(id)]; if (!d || d === "both") return 1;
    const rel = d === "spirit" ? (mix.comp - mix.avg) / mix.avg : ((1 - mix.comp) - (1 - mix.avg)) / (1 - mix.avg);
    return Math.min(1.8, Math.max(0.5, 1 + mw * rel)); };
  return items.map(it => {
    let comp = 0, nCount = 0; const per = {}, late = {};
    for (const { e, w } of ew) {
      const p = pairs.get(it.item_id + "|" + e), c = p ? p.c : 0;
      const spike = spikes.get(e) ?? 32, behind = Math.max(0, (it.buy_min ?? spike) - spike);
      const tf = 1 / (1 + behind / tau);              // a counter that arrives after the enemy's spike is worth less
      per[e] = p ? c : null; late[e] = tf;
      comp += w * (need ? need.get(e) : 1) * tf * (c >= 0 ? c : neg * c);
      if (c > 0.5 * unit) nCount++;
    }
    const stack = 1 + ((CB.team_stacking || {})[String(it.item_id)] || 0), mm = mixMult(it.item_id);
    const fitRaw = fitOf(it.item_id), fit = fitRaw ?? 0, costF = Math.pow(Math.max(1, it.cost) / 3200, a);
    return { ...it, per, late, comp: comp * stack * mm, stack, mix: mm, fit: fitRaw, n_countered: nCount,
      refresh: (CB.refresh_only || []).includes(String(it.item_id)), score: (comp * stack * mm + fw * fit) / costF };
  });
}

const IMPACT = [["dmg_out", "Dmg dealt", 1], ["bullet_out", "Bullet dmg", 1], ["ability_out", "Ability dmg", 1],

function renderImpact(el) {

    <div class="card"><h2>Does it only work when you are already winning?</h2>
      <p class="why">State-adjusted win effect when the item is bought from behind (x, predicted win chance &lt; 40%) against when it is bought ahead (y, &gt; 60%).

      tip: r => `<b>${esc(r.name)}</b> · ${shop(r.tier)} ${esc(r.slot || "")}${kind(r) ? ` · ${IMPACT_KIND[kind(r)][0]}` : ""}<br>` +

      { key: "tier", label: "Shop", fmt: shop }, { key: "n", label: "Purchases", fmt: v => num(v), tip: "Purchases with a before and an after window" },
      ...avail.map(([k, l, g]) => ({ key: k + "_pct", label: `${l} Δ`, fmt: (v, r) => `${sgnc(v, 1, g)}${r[k + "_pct_se"] != null && k === state.impMetric ? ` <span class="sub">±${(1.96 * r[k + "_pct_se"] * 100).toFixed(1)}</span>` : ""}`,
        tip: `${l}: change in per-minute rate after the purchase vs the same-tier baseline, % of baseline` })),
      { key: "win_effect_behind", label: "Win (behind)", fmt: pp }, { key: "win_effect_even", label: "Win (even)", fmt: pp },

      { sort: state.impMetric + "_pct", desc: good > 0 });

  const presetLabel = s => s === "standard" ? "Standard (settings)" : s === "custom" ? "Custom" : cap(s.replace(/_/g, " "));
  const curPreset = vPresetName();
  el.innerHTML = `<div class="toolbar"><span class="grp"><span class="lbl">Hero</span><span id="vhero"></span></span>
      <span class="grp"><span class="lbl">Prices</span><div class="seg" id="vprice" role="group" aria-label="Pricing">
        <button data-p="average" aria-pressed="${state.vPrice === "average"}" ${hero ? "" : "disabled"} title="Price this hero's stats at the average hero's rates: items that suit the kit score above 1.0×, even plain stat items">Average-hero rates</button>
        <button data-p="own" aria-pressed="${state.vPrice === "own"}" ${hero ? "" : "disabled"} title="Calibrate on this hero: its plain stat items are 1.0×, so this ranks items within the hero">This hero's own rates</button></div></span>
      <span class="grp"><span class="lbl">Evaluated at</span><div class="seg" id="vstage" role="group" aria-label="Game stage">
      ${["tier", ...stages].map(s => `<button data-s="${s}" aria-pressed="${s === state.vStage}">${esc(stLabel(s))}</button>`).join("")}</div></span></div>
    <div class="card"><details class="model" id="vdet" ${state.vOpen ? "open" : ""}><summary><h2>Model assumptions</h2><span class="sub" id="vchg"></span></summary>
      <div class="toolbar" style="margin-top:10px"><span class="lbl">Preset</span><select id="vpreset" aria-label="Preset">
        ${[...Object.keys(vPresets()), ...(curPreset === "custom" ? ["custom"] : [])].map(s => `<option value="${s}" ${s === curPreset ? "selected" : ""} ${s === "custom" ? "disabled" : ""}>${esc(presetLabel(s))}</option>`).join("")}</select>
        <button class="btn" id="vreset" type="button">Reset to defaults</button></div>
      <div class="params">${VPARAMS.map(([g, ps]) => `<h3>${esc(g)}</h3>${ps.map(([p, lab, step]) => {
        const def = getPath(IVI.A, p), v = state.vA[p] ?? def;
        return `<label class="pf ${p in state.vA ? "chg" : ""}" title="Default ${def}"><span>${esc(lab)}</span><input type="number" data-p="${p}" step="${step}" min="0" value="${v}"></label>`; }).join("")}`).join("")}</div>
      <p class="note">Everything on this tab is recomputed in your browser from the item cards; edits are remembered on this device. Defaults come from settings.yaml (item_value); what each card property means is in dla/item_rules.yaml.</p>
    </details></div>
    <div class="toolbar">${itemFilterBar("value")}</div>
    <div class="card"><h2>On paper vs in practice</h2><p class="why" id="vscwhy"></p>
      <div class="toolbar">${labelToggle("value", "items")}<span class="grow"></span>${tierLegend()}</div><div id="vsc"></div></div>
    <div class="card"><h2>Return on investment</h2><p class="why" id="vwhy"></p>
      <div class="toolbar"><span class="legend">${VGROUPS.map(([g, , c]) => `<span class="sw" style="background:${c}"></span>${g}`).join("")}</span></div>
      <div id="vtb"></div>
      <p class="note">ROI = souls-equivalent value ÷ cost. For the average hero the reference items (Extra Health, Rapid Rounds, Extra Spirit, Extra Regen, …) are 1.0× by construction; for a hero at average-hero rates they move with the kit. Value = souls of plain stat items this item replaces — a second number for slot efficiency, since higher tiers concentrate value in one slot. Preset columns: ROI with that preset applied on top of the current assumptions. Unmodeled = card properties the rules do not price (ROI understates those items).</p></div>
    <div class="card"><h2 id="vkith">Hero kits</h2><p class="why" id="vkitwhy"></p><div id="vkit"></div>
      <p class="note">Read from each ability's data: cooldown → casts per fight (one ${IVI.A.combat_s}-s fight per minute, recast ${IVI.A.cast_delay} s after the cooldown), damage values by what they scale with — spirit power, weapon damage or melee damage — (per cast, per second × duration, per bullet hit, or build-up procs), gun buffs (extra shooting from fire rate / bullet damage bonuses), CC durations and healing. Passives (no cooldown) are never repeated by Echo Shard or Refresher and do not gain from cooldown, duration or per-cast items. “rule” rows follow dla/ability_rules.yaml (abilities the data alone gets wrong, e.g. Mina's ult growing with Love Bites); “generic” rows are the automatic reading and may be off — those are the ones to check.</p></div>
    <div class="card"><h2>Per-channel leaderboard</h2><p class="why">Raw amounts from the item's numbers, without any pricing: which item gives the most of one thing per soul.</p>
      <div class="toolbar"><span class="lbl">Channel</span><select id="vchan" aria-label="Channel"></select><span class="sub" id="vunit"></span></div><div id="vch"></div></div>
    <div class="card"><h2 id="vassh">Reference hero</h2><div id="vass"></div></div>`;

  combo(el.querySelector("#vhero"), [{ v: "avg", label: "Average hero", sep: true }, ...IVI.heroes.map(h => ({ v: h.id, label: h.name }))],
    state.vHero, v => { state.vHero = v; renderValue(el); }, { label: "Hero" });
  el.querySelector("#vprice").onclick = e => { const b = e.target.closest("button"); if (!b || b.disabled) return; state.vPrice = b.dataset.p; renderValue(el); };
  el.querySelector("#vstage").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.vStage = b.dataset.s; renderValue(el); };
  el.querySelector("#vdet").ontoggle = e => { state.vOpen = e.target.open; };
  el.querySelector("#vpreset").onchange = e => { state.vA = { ...vPresets()[e.target.value] }; vSave(); renderValue(el); };
  el.querySelector("#vreset").onclick = () => { state.vA = {}; vSave(); renderValue(el); };
  let timer;
  const later = () => { clearTimeout(timer); timer = setTimeout(draw, 150); };
  el.querySelectorAll("input[data-p]").forEach(inp => inp.oninput = () => {
    const p = inp.dataset.p, v = parseFloat(inp.value), def = getPath(IVI.A, p);
    if (!isFinite(v)) return;
    if (Math.abs(v - def) < 1e-9) delete state.vA[p]; else state.vA[p] = v;
    inp.closest(".pf").classList.toggle("chg", p in state.vA);
    vSave(); later();
  });
  el.querySelector("#vchan").onchange = e => { state.vChan = e.target.value; draw(); };

  const draw = () => {
    const vc = vCompute(), keep = filter();
    const nEdits = Object.keys(state.vA).length;
    el.querySelector("#vchg").textContent = (nEdits ? `${nEdits} changed from the defaults · ` : "Defaults from settings.yaml · ") +
      `${presetLabel(vPresetName())} · computed in ${vc.ms.toFixed(0)} ms`;
    const fit = hero ? new Map(inScope("hero_item_fit").filter(r => String(r.hero_id) === String(hero.id)).map(r => [r.item_id, r.effect_shrunk])) : null;
    const eff = new Map(inScope("item_effects").map(r => [r.item_id, r.effect]));
    const base = vc.main.rows.filter(r => state.vStage === "tier" ? r.tier_stage : r.stage === state.vStage).map(r => {
      const o = { ...r, data_effect: hero ? fit.get(r.item_id) : eff.get(r.item_id) };
      for (const s of scen) o["roi_" + s] = vc.scen[s].get(r.item_id + "|" + r.stage);
      return o; });
    const all = withTiers(base, r => r.roi);
    const chans = Object.keys(CH_LABEL).filter(c => vc.main.rows.some(r => r["q_" + c]));
    if (!chans.includes(state.vChan)) state.vChan = chans[0];
    el.querySelector("#vchan").innerHTML = chans.map(c => `<option value="${c}" ${c === state.vChan ? "selected" : ""}>${esc(CH_LABEL[c])}</option>`).join("");
    const who = hero ? hero.name : "the average hero";
    const priced = !hero ? "" : state.vPrice === "own" ? ` Prices calibrated on ${hero.name}: the plain stat items are 1.0× for ${hero.name} too, so this ranks items within the hero.`
      : ` ${hero.name}'s stats priced at the average hero's rates, so items that suit the kit score above 1.0× — plain stat items included.`;
    el.querySelector("#vwhy").textContent = (state.vStage === "tier"
      ? `Each item at the game stage its tier is usually bought in (T1–T2 early, T3 mid, T4 late), for ${who}.` : `Every item evaluated for ${who} at the ${state.vStage} stage.`) + priced;
    el.querySelector("#vscwhy").textContent = `x: stat value per soul from the item's numbers alone (1.0 = as efficient as the shop's plain stat items for the average hero). y: the item's state-adjusted win effect in matches (this scope${hero ? `, bought on ${hero.name}` : ""}). Right and low = strong numbers that are not converting; left and high = worth more than its numbers (utility, timing, or mechanics the model does not price).`;
    const groups = r => VGROUPS.map(([g, cs, c]) => [g, cs.reduce((a, k) => a + Math.max(0, r["v_" + k] || 0), 0), c]);
    const maxRoi = Math.max(1e-9, ...all.map(r => r.roi || 0));
    const stack = r => { const gs = groups(r), tot = gs.reduce((a, [, v]) => a + v, 0) || 1, w = 130 * Math.min(1, Math.max(0, r.roi || 0) / maxRoi);
      return `<span class="stack" style="width:${w.toFixed(0)}px">${gs.filter(([, v]) => v > 0).map(([g, v, c]) => `<span style="flex:${v / tot};background:${c}" title="${g}: ${num(v)} souls"></span>`).join("")}</span>`; };
    const lines = r => chans.filter(c => r["q_" + c]).map(c => `${esc(CH_LABEL[c])}: ${num(r["q_" + c], Math.abs(r["q_" + c]) < 10 ? 2 : 0)} <span class="sub">${esc(units[c] || "")} → ${num(r["v_" + c])} souls</span>`).join("<br>");
    const pts = all.filter(keep).filter(r => r.roi != null && r.data_effect != null);
    const nset = new Set([...[...pts].sort((a, b) => b.roi - a.roi).slice(0, 7), ...[...pts].sort((a, b) => a.roi - b.roi).slice(0, 3),
                          ...[...pts].sort((a, b) => b.data_effect - a.data_effect).slice(0, 4)]);
    const plot = () => scatterPlot(el.querySelector("#vsc"), pts, {
      x: r => r.roi, y: r => r.data_effect, label: r => r.name, tier: r => r._t, ref: 0, xRef: 1,
      xTick: t => Number(t.toFixed(2)) + "×", yTick: ppTick, xTitle: "ROI from the item's numbers (souls of stats per soul)",
      yTitle: hero ? `Win effect on ${hero.name}, pp` : "Win effect in matches, pp",
      notable: r => nset.has(r), labelAll: state.labelAll.value, height: state.labelAll.value ? 640 : 460,
      tip: r => `${badge(r._t)} <b>${esc(r.name)}</b> · ${shop(r.tier)} ${esc(r.slot || "")}<br>ROI ${num(r.roi, 2)}× · value ${num(r.value)} souls · win effect ${pp(r.data_effect)}<br>${lines(r)}${r.note ? `<br><i>${esc(r.note)}</i>` : ""}` });
    bindLabelToggle(el, "value", plot); plot();
    table(el.querySelector("#vtb"), all.filter(keep), [
      TIER_COL("ROI"), { key: "name", label: "Item", l: 1, fmt: (v, r) => `${esc(v)}${r.reference ? ' <span class="sub" title="Calibration item: 1.0× for the average hero">ref</span>' : ""}` },
      { key: "slot", label: "Slot type", l: 1 }, { key: "tier", label: "Shop", fmt: shop },
      { key: "roi", label: "ROI", fmt: v => v == null ? "–" : num(v, 2) + "×" },
      { key: "value", label: "Value", fmt: v => num(v), tip: "Souls of plain stat items this item's numbers are worth" },
      { key: "main_channel", label: "Breakdown", l: 1, fmt: (v, r) => `${stack(r)}<span class="sub">${esc(CH_LABEL[v] || "")}</span>` },
      ...scen.map(s => ({ key: "roi_" + s, label: s.replace(/_/g, " "), fmt: v => v == null ? "–" : num(v, 2) + "×",
        tip: `ROI with the ${s.replace(/_/g, " ")} preset (${JSON.stringify(IVI.A.scenarios[s])}) on top of the current assumptions` })),
      { key: "data_effect", label: hero ? `Win effect on ${hero.name}` : "Win effect", fmt: pp, tip: "State-adjusted win effect in matches (Items tab), for comparison" },
      { key: "unmodeled", label: "Unmodeled / note", l: 1, fmt: (v, r) => `<span class="sub">${esc([v, r.note].filter(Boolean).join(" · "))}</span>` }],
      { sort: "roi" });
    const c = state.vChan;
    el.querySelector("#vunit").textContent = units[c] ? `Unit: ${units[c]}` : "";
    const lb = withTiers(all.filter(keep).filter(r => r["q_" + c] > 0).map(r => ({ ...r, amount: r["q_" + c], per1k: r["q_" + c] / r.cost * 1000,
      share: r.value > 0 ? r["v_" + c] / r.value : null })), r => r.per1k);
    table(el.querySelector("#vch"), lb, [
      TIER_COL(`${CH_LABEL[c]} per soul`), { key: "name", label: "Item", l: 1 }, { key: "tier", label: "Shop", fmt: shop }, { key: "cost", label: "Cost", fmt: v => num(v) },
      { key: "amount", label: CH_LABEL[c], fmt: v => num(v, v < 10 ? 2 : 0), tip: units[c] }, { key: "per1k", label: "per 1k souls", fmt: v => num(v, v < 10 ? 2 : 1), bar: 1 },
      { key: "share", label: "Share of value", fmt: pct }], { sort: "per1k", height: "460px" });
    // hero kits: per-ability breakdown for a hero, or every hero side by side
    const A = { ...IVI.A, ...vOverrides(state.vA) }, refs = vc.main.meta.refs, pr = vc.main.meta.prices;
    const kStage = state.vStage === "tier" ? "mid" : state.vStage;
    const E = new IV.Engine(IVI, vOverrides(state.vA)), avgRef = E.ref(kStage).describe();
    const f1 = v => num(v, 1), f2 = v => num(v, 2);
    if (hero) {
      const rf = refs[kStage];
      el.querySelector("#vkith").textContent = `${hero.name}'s kit`;
      el.querySelector("#vkitwhy").textContent = `${cap(kStage)} stage, ${num(rf.spirit_power)} spirit power. Per fight: ${num(rf.spirit_dmg_per_fight)} spirit damage from abilities (${num(rf.active_spirit_dmg_per_fight)} from cast abilities; passives do not benefit from cooldown, duration or per-cast items), +${f2(rf.spirit_dmg_per_sp)} per point of spirit power (average hero +${f2(avgRef.spirit_dmg_per_sp)}); ${num(rf.gun_dmg_per_fight)} gun damage plus ${num(rf.ability_weapon_dmg_per_fight)} weapon damage and ${num(rf.ability_melee_dmg_per_fight)} melee damage from abilities (weapon / melee items amplify these). ${f1(rf.casts_per_fight)} casts, ${f1(rf.hits_per_fight)} bullet hits and ${f2(rf.headshots_per_fight)} headshots (${f1(rf.shots_per_s)} shots/s sustained over magazine and reload; average hero ${f1(avgRef.hits_per_fight)} hits, ${f2(avgRef.headshots_per_fight)} headshots, ${f1(avgRef.casts_per_fight)} casts).`;
      const kr = vc.main.meta.kit[kStage] || [];
      // which ability Echo Shard / Refresher repeat (the engine's choice): best active non-ultimate / the ultimate
      const dmg = v => v ? num(v) : "–";
      const ROLE_TIP = { "Echo Shard": "Echo Shard repeats this ability: the best active non-ultimate", "Refresher": "Refresher repeats the ultimate",
        "passive": "Passive: never repeated by Echo Shard / Refresher; not affected by cooldown, duration or per-cast items" };
      table(el.querySelector("#vkit"), kr.map(r => ({ ...r, role: r.passive ? "passive" : r.ult ? "Refresher" : r.echo ? "Echo Shard" : "" })), [
        { key: "slot", label: "#", l: 1, fmt: (v, r) => r.ult ? `${v} <span class="sub">ult</span>` : v },
        { key: "name", label: "Ability", l: 1, fmt: (v, r) => `${esc(v)}${r.role ? ` <span class="chip" title="${esc(ROLE_TIP[r.role])}">${esc(r.role)}</span>` : ""}${r.src === "rule" ? ` <span class="sub" title="${esc(r.note || "")}">rule ⓘ</span>` : ` <span class="sub" title="Generic reading of the ability data">gen.</span>`}`,
          tip: "Tags: which item repeats the ability. rule = described in dla/ability_rules.yaml (hover for the note); gen. = automatic reading" },
        { key: "cd", label: "Cooldown", fmt: (v, r) => r.passive ? "passive" : num(v, 1) + " s" },
        { key: "uses", label: "Casts / fight", fmt: (v, r) => r.passive ? "–" : f2(v) },
        { key: "dmg_cast", label: "Spirit / cast", fmt: dmg, tip: "Spirit damage per cast at this stage's spirit power, incl. hits during the ability and area targets" },
        { key: "coef_cast", label: "+ per SP", fmt: v => v ? f2(v) : "–", tip: "Spirit damage one cast gains per point of spirit power" },
        { key: "wdmg_cast", label: "Weapon / cast", fmt: dmg, tip: "Weapon damage per cast: weapon-scaled ability damage, or the extra shooting of a gun buff (fire rate, bullet damage)" },
        { key: "mdmg_cast", label: "Melee / cast", fmt: dmg, tip: "Damage that scales with the hero's melee damage" },
        { key: "dmg_fight", label: "Spirit / fight", fmt: dmg, bar: 1 },
        { key: "wdmg_fight", label: "Weapon / fight", fmt: dmg },
        { key: "mdmg_fight", label: "Melee / fight", fmt: dmg },
        { key: "cc_cast", label: "CC / cast", fmt: v => v ? num(v, 2) + " s" : "–", tip: "Stun-equivalent seconds (silence, disarm, immobilize weighted), × heroes hit" },
        { key: "slow_cast", label: "Slow / cast", fmt: v => v ? num(v) + " %·s" : "–" },
        { key: "heal_fight", label: "Heal / fight", fmt: v => v ? num(v) : "–" }], { sort: "slot", desc: false, height: "300px" });
    } else {
      el.querySelector("#vkith").textContent = "Hero kits";
      el.querySelector("#vkitwhy").textContent = `How each hero converts spirit power and bullets into item procs, at the ${kStage} stage. Pick a hero above for the per-ability breakdown.`;
      const kr = IVI.heroes.map(h => { const d = E.ref(kStage, h).describe();
        return { hero: h.name, ...d, rules: h.abilities.filter(a => a.src === "rule").length }; });
      table(el.querySelector("#vkit"), kr, [
        { key: "hero", label: "Hero", l: 1 }, { key: "spirit_dmg_per_fight", label: "Spirit dmg / fight", fmt: v => num(v) },
        { key: "spirit_dmg_per_sp", label: "+ per SP / fight", fmt: f2, bar: 1, tip: "What a point of spirit power is worth to this kit: drives Extra Spirit and other spirit-power items" },
        { key: "gun_dmg_per_fight", label: "Gun dmg / fight", fmt: v => num(v) },
        { key: "ability_weapon_dmg_per_fight", label: "Ability weapon dmg", fmt: v => v ? num(v) : "–", tip: "Weapon-scaled ability damage and gun buffs per fight: amplified by weapon damage items" },
        { key: "ability_melee_dmg_per_fight", label: "Ability melee dmg", fmt: v => v ? num(v) : "–", tip: "Melee-scaled ability damage per fight: amplified by melee items" },
        { key: "casts_per_fight", label: "Casts / fight", fmt: f2, tip: "Drives cast-triggered items (Mystic Burst, …)" },
        { key: "shots_per_s", label: "Shots/s (sustained)", fmt: f2 }, { key: "hits_per_fight", label: "Hits / fight", fmt: f1 },
        { key: "headshots_per_fight", label: "Headshots / fight", fmt: f2, tip: "Drives headshot items (Headshot Booster, Headhunter)" },
        { key: "rules", label: "Abilities with rules", fmt: v => v || "–" }], { sort: "spirit_dmg_per_sp", height: "300px" });
    }
    // reference hero and prices actually used
    el.querySelector("#vassh").textContent = hero ? `${hero.name} as the reference hero` : "Reference hero (average of all heroes)";
    el.querySelector("#vass").innerHTML = `<div class="kv">
      <div><b>Fight model.</b> One fight of ${A.combat_s} s per minute; ${pct(A.shoot_share)} of it shooting at heroes with ${pct(A.hit_rate)} hits (shots and casts come from the hero's gun and cooldowns);
        ${A.triggers_per_fight.melee} melee hits per fight; area effects hit ${A.targets} heroes; conditional effects up ${pct(A.cond_uptime)} of the fight.</div>
      <div><b>Incoming damage.</b> ${Object.entries(A.incoming_mix).map(([k, v]) => `${pct(v)} ${k}`).join(", ")}; a fight costs ${pct(A.incoming_share)} of your effective HP.
        CC is priced from the damage a disabled enemy does not deal (1 s stun = ${A.stun_dps_multiple}× their DPS).</div>
      ${hero ? `<div><b>${esc(hero.name)}.</b> Base ${num(hero.max_health)} HP; gun ${num(hero.dps, 1)} DPS (${num(hero.bullet, 1)} per bullet × ${hero.bps}, ${num(hero.rps, 2)} shots/s,
        ${num(hero.clip)}-round magazine, ${num(hero.reload, 2)} s reload). Kit: see the table above.</div>` : ""}
      <div><b>Procs.</b> An item with a cooldown that needs a trigger (headshot, cast, melee hit) fires on average every cooldown + 1/(trigger rate) seconds, and only if a trigger happens in the fight at all; headshots are ${pct(A.headshot_share)} of bullet hits.</div>
      ${stages.map(s => `<div><b>${esc(stLabel(s))}.</b> ${refs[s].boons} boons, ${num(refs[s].hp)} HP (${num(refs[s].ehp)} effective), ${num(refs[s].spirit_power, 0)} spirit power;
        ${num(refs[s].weapon_dmg_per_fight)} weapon / ${num(refs[s].spirit_dmg_per_fight)} spirit damage per fight. Prices${hero && state.vPrice === "average" ? " (average hero)" : ""}: 1 effective HP = ${num(pr[s].ehp, 2)}, 1 weapon damage = ${num(pr[s].weapon, 1)},
        1 spirit damage = ${num(pr[s].spirit, 1)}, 1 s stun = ${num(pr[s].hard_cc)} souls.</div>`).join("")}
      </div>`;
  };
  const filter = bindItemFilter(el, "value", draw); draw();
}

function renderFits(el) {
  const sel = state.fitHero ?? firstHero();
  el.innerHTML = `<div class="card"><h2>Which items fit this hero?</h2><p class="why">Effect on this hero, how much of that is hero-specific, and what similar playstyles predict.</p>
    <div class="toolbar"><span class="lbl">Hero</span><span id="fh"></span><label class="chk"><input type="checkbox" id="fonly"> Only underused</label></div><div id="ftb"></div>
    <p class="note">Hero-specific = effect on this hero minus the item's average effect (shrunk toward 0 when the sample is small). Profile fit = what heroes with a similar kill mix, range, scaling and kit predict for this item (this hero's own data left out).</p></div>`;
  combo(el.querySelector("#fh"), heroList(), sel, v => { state.fitHero = v; renderFits(el); }, { label: "Hero" });
  const only = el.querySelector("#fonly");
  only.checked = !!state.fitOnly; only.onchange = e => { state.fitOnly = e.target.checked; renderFits(el); };
  let d = withCoreTiers(inScope("hero_item_fit").filter(r => r.hero_id === Number(sel)), r => r.effect_shrunk);
  if (state.fitOnly) d = d.filter(r => r.underused_proven || r.underused_predicted);
  table(el.querySelector("#ftb"), d, [
    TIER_COL("effect on this hero"), { key: "name", label: "Item", l: 1 }, { key: "tier", label: "Shop", fmt: shop }, { key: "n", label: "Buys", fmt: v => num(v) },
    { key: "buy_rate", label: "Bought", fmt: pct }, { key: "effect_shrunk", label: "Effect on hero", fmt: pp, bar: 1 },
    { key: "hero_specific", label: "Hero-specific", fmt: pp, bar: 1 }, { key: "fit_predicted", label: "Profile fit", fmt: pp, bar: 1 },
    { key: "median_buy_min", label: "Buy min", fmt: v => num(v, 1) }, { key: "underused_proven", label: "Underused", l: 1, fmt: (v, r) => flags(r) }],
    { sort: "effect_shrunk" });
}

function renderMatchups(el) {
  const sel = state.mHero ?? firstHero();
  el.innerHTML = `<div class="toolbar"><span class="lbl">Hero</span><span id="mh"></span></div>
    <div class="grid2"><div class="card"><h2>Against enemies</h2><p class="why">Win rate above what both heroes' overall strength predicts. Positive = this hero counters them.</p><div id="mt1"></div></div>
    <div class="card"><h2>With allies</h2><p class="why">Synergy: win rate above expectation when on the same team.</p><div id="mt2"></div></div></div>`;
  combo(el.querySelector("#mh"), heroList(), sel, v => { state.mHero = v; renderMatchups(el); }, { label: "Hero" });
  const h = Number(sel);
  const vs = withTiers(inScope("hero_counters").filter(r => r.hero_a === h).map(r => ({ ...r, other: r.name_b })), r => r.effect_shrunk);
  const syn = withTiers(inScope("hero_synergy").filter(r => r.hero_a === h || r.hero_b === h).map(r => ({ ...r, other: r.hero_a === h ? r.name_b : r.name_a })), r => r.effect_shrunk);
  const cols = [TIER_COL("win rate above expected"), { key: "other", label: "Hero", l: 1 }, { key: "n", label: "Games", fmt: v => num(v) },
                { key: "win_rate", label: "Raw WR", fmt: pct }, { key: "effect_shrunk", label: "Above expected", fmt: pp, bar: 1 }];
  table(el.querySelector("#mt1"), vs, cols, { sort: "effect_shrunk", height: "min(70vh, 620px)" });
  table(el.querySelector("#mt2"), syn, cols, { sort: "effect_shrunk", height: "min(70vh, 620px)" });
}

function renderProfiles(el) {
  el.innerHTML = `<div class="card"><h2>Playstyle profiles</h2><p class="why">Observed behaviour (all in-scope matches) and static stats used to predict hero × item fits.</p><div id="ptb"></div></div>`;
  table(el.querySelector("#ptb"), rows("hero_profiles"), [
    { key: "hero", label: "Hero", l: 1 }, { key: "melee_kill_share", label: "Melee kills", fmt: pct },
    { key: "bullet_kill_share", label: "Bullet kills", fmt: pct }, { key: "ability_kill_share", label: "Ability kills", fmt: pct },
    { key: "bullet_engage_dist_m", label: "Gun range m", fmt: v => num(v, 1) }, { key: "ability_engage_dist_m", label: "Ability range m", fmt: v => num(v, 1) },
    { key: "hit_rate", label: "Hit rate", fmt: pct }, { key: "crit_rate", label: "Headshot %", fmt: pct },
    { key: "parries_per_game", label: "Parries/g", fmt: v => num(v, 2) }, { key: "jungle_soul_share", label: "Jungle souls", fmt: pct },
    { key: "heavy_melee", label: "Heavy melee", fmt: v => num(v) }, { key: "heavy_melee_scaling", label: "Melee scale", fmt: v => num(v, 2) },
    { key: "weapon_dps", label: "Gun DPS", fmt: v => num(v, 1) }, { key: "kit_spirit_scaling", label: "Kit spirit scale", fmt: v => num(v, 2) }],
    { sort: "melee_kill_share" });
}

function renderMethod(el) {
  const s2 = (META.season_starts || [])[0];
  el.innerHTML = `<div class="card method"><h2>How to read this</h2>
  <p><b>Scope.</b> Matches since ${META.patch_start}, Ranked + Unranked (toggle Ranked only), Normal mode, ≥10 min, no abandons. Initiate–Acolyte excluded. Unranked matches are bracketed by the average ranked badge of their players (≥${META.min_known_players ?? 3} of 12 known; matches with fewer count only toward All ranks).${s2 ? ` Ranked Beta Season 2 started ${esc(s2.slice(0, 16))} UTC; earlier badges are mapped onto the Season 2 scale.` : ""}</p>
  <p><b>Tiers (S–F).</b> Relative to the list or chart they appear in: each value's distance from the median of that population in standard deviations. S ≥ +1.5, A ≥ +0.9, B ≥ +0.3, C within ±0.3, D ≤ −0.3, E ≤ −0.9, F ≤ −1.5. A tier says how an entry ranks among its peers in this view, not that it is significant; check the effect's interval or q-value.</p>
  <p><b>Hero strength.</b> L2 logistic regression of the match result on both drafts, skill difference, side and mode. Adj. win rate = a team with this hero instead of an average one.</p>
  <p><b>Item effect.</b> A per-tick state model gives each team's win probability from souls lead, kill lead, skill and draft. Each purchase is scored against the state at the moment it was bought; an item's effect is its buyers' surplus over that prediction, relative to every other item of the same shop tier bought at the same time. This removes "winners buy more items" bias. It does not remove choice bias entirely (players buy defensive items when they are under pressure), so treat small effects with care.</p>
  <p><b>Purchase time.</b> Median minute at which the item is bought (in this scope, or by this hero).</p>
  <p><b>Counters.</b> Two independent checks: the item's effect with vs without the enemy hero (each against its own baseline of other items bought in the same kind of match), and Mantel–Haenszel kill-share odds within the same match, side and 5-minute window.</p>
  <p><b>Core items.</b> An item bought by ≥${Math.round((META.core_buy_rate ?? 0.5) * 100)}% of a hero's players is <i>core</i> on that hero. Its win delta is ~0 by construction (it is most of its own "same tier, same time" baseline), so it gets a CORE badge instead of an S–F tier and is measured by an on-time effect: at the first stats tick after its median buy time, players who own it (or anything built from it) vs players who do not, each against the win chance their game state predicts. This is the cost of being late or skipping it.</p>
  <p><b>Item impact.</b> For each purchase, per-minute output in the stats interval before vs after it (purchase interval skipped), minus the same change for the same hero buying another item of that tier at the same time. Hero damage is split into bullet and ability damage from the per-tick engagement stats. The game-state split uses the state model's win chance at purchase (&lt;40% behind, &gt;60% ahead). Per enemy hero (Item counters), the enemy's own damage and healing are measured the same way.</p>
  <p><b>Counterbuy planner.</b> For each item and enemy hero, a counter strength combines the Item counters signals (extra win effect when that hero is an enemy, kill odds, protection, and the hero's damage / healing and your damage taken right after the purchase), each scaled to its spread over all item × hero pairs and expressed in pp of win effect. Against a comp, each enemy is weighted by how hard it counters your hero (Hero matchups); the item's score sums the weighted counter strengths (penalties damped), adds a bonus for items whose effect stacks across teammates, adds a little of the item's own effect on your hero, and divides by cost to a power that slides between value per slot and value per soul. The recommended set is picked one item at a time, discounting enemies already covered; core items count as free. Each enemy's counter value is discounted when the item typically arrives after that enemy's power spike (the match length where its win rate is highest relative to other heroes), and bullet / spirit defense items are scaled by the comp's damage mix (ability damage share from Playstyle profiles). Team stacking: Healbane (confirmed) and passive resist-shred items get a bonus; active timed debuffs only refresh and get none. The meta section scores the same way against the most-picked heroes, weighted by pick rate.</p>
  <p><b>Item value.</b> Game data only, no matches: each card property is converted into effective HP, healing, damage, CC or utility for a reference hero in a ${META.item_value?.A?.combat_s ?? 15}-second fight, then priced from the shop's own single-stat items, so ROI 1.0 = as efficient as Extra Health / Rapid Rounds / Extra Spirit for the average hero. Each hero's abilities are read from the game data (cooldowns → casts per fight, damage with its spirit scaling, CC, healing; dla/ability_rules.yaml for the ones the data alone gets wrong), and its gun gives sustained shots, hits and headshots per fight, so procs like Headshot Booster fire as often as that hero can trigger them (cooldown plus the wait for the next trigger). Echo Shard and Refresher are valued as a second cast of the best regular ability / the ultimate. Pick a hero to use its HP, gun and kit: its stats are then priced at the average hero's rates, so Extra Spirit is worth more than 1.0× on a hero whose abilities scale hard with spirit power and less on a gun hero. It depends on the fight assumptions, which can be edited on the tab and are recomputed in the browser; the preset columns show how much they matter.</p>
  <p><b>Shrinkage.</b> Hero × item, counter and matchup estimates are pulled toward zero (empirical Bayes) in proportion to their noise; q-values control the false discovery rate.</p>
  <p class="note">Generated ${META.generated}. Rebuild: python -m dla.ingest · python -m dla.load · python -m dla.analyze · python -m dla.dashboard</p></div>`;
}

const R = { overview: renderOverview, heroes: renderHeroes, items: renderItems, counters: renderCounters, counterbuy: renderCounterbuy, impact: renderImpact,
            value: renderValue, fits: renderFits, matchups: renderMatchups, profiles: renderProfiles, method: renderMethod };
function render() {
  seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.b === state.bracket));
  if (!TABS.some(([k]) => k === state.tab)) state.tab = "overview";
  tabsEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === state.tab));
  document.getElementById("scopeCount").textContent = `${num(META.matches_by_scope[scopeName()] || 0)} matches in this scope`;
  try { history.replaceState(null, "", "#" + state.tab + "/" + encodeURIComponent(state.bracket)); } catch (e) {}
  document.getElementById("tip").hidden = true;
  for (const [k] of TABS) { const s = document.getElementById("tab-" + k); s.hidden = k !== state.tab; if (k === state.tab) { s.innerHTML = ""; R[k](s); } }
}
// charts are sized to their container: redraw on width changes
let lastW = innerWidth, rt;
addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(render, 150); });
render();
</script>
</body>
</html>
